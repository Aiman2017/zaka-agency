<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Zaka-agency logo">
  <defs>
    <!--
      Brand gradient: purple → pink (matches #642ca9→#ff36ab used site-wide)
      The gradient background makes this logo readable on both light and dark backgrounds.
    -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#642ca9"/>
      <stop offset="100%" stop-color="#ff36ab"/>
    </linearGradient>

    <!-- Clip everything to a rounded square shape -->
    <clipPath id="clip">
      <rect width="100" height="100" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Gradient background -->
    <rect width="100" height="100" fill="url(#bg)"/>

    <g fill="white">
      <!--
        TOP SWEEPING STROKE
        Thick calligraphic arc: lower-left tip → sweeps up → upper-right end
      -->
      <path d="
        M 20,49
        C 32,30 58,19 80,24
        L 78,36
        C 56,28 28,42 22,59
        Z
      "/>

      <!--
        BOTTOM SWEEPING STROKE
        Thick calligraphic arc: lower-left → sweeps down-right
      -->
      <path d="
        M 22,66
        C 36,58 60,61 80,72
        L 78,82
        C 56,70 28,71 20,81
        Z
      "/>

      <!--
        MIDDLE DIAGONAL
        Parallelogram connecting upper-right to lower-left (the slash of the Z)
      -->
      <path d="
        M 78,28
        L 28,68
        L 22,74
        L 72,34
        Z
      "/>

      <!--
        RIGHT-POINTING ARROWHEAD
        Sits on the diagonal midpoint, tip pointing east — the "flow" indicator
      -->
      <path d="M 51,48 L 64,54 L 51,60 Z"/>

      <!--
        LOWER-LEFT TAIL ARROW
        Spike off the bottom-left of the diagonal, pointing ~8-o'clock direction
      -->
      <path d="M 26,70 L 21,84 L 30,86 Z"/>
    </g>
  </g>
</svg>
