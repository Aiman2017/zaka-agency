


  <!-- UPLOAD FORM -->
    <section style="background:var(--gray-100);padding:90px 0;">
        <div class="container">
            <div class="text-center mb-5">
                <span class="section-label">Upload Media</span>
                <h2 class="section-title">Share Your Experience</h2>
                <div class="section-divider"></div>
                <p class="section-subtitle">Students and staff can submit photos and videos to be featured in our gallery.
                </p>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="contact-form-card">
                        <form id="uploadForm" novalidate>
                            <!-- Upload Zone -->
                            <div class="mb-4">
                                <label class="form-label fw-600">Upload Files <span class="text-danger">*</span></label>
                                <div class="upload-zone" id="uploadZone">
                                    <i class="bi bi-cloud-arrow-up d-block"></i>
                                    <h6 class="mt-2 fw-700">Drag & Drop or Click to Upload</h6>
                                    <p class="text-muted small mb-0">Supports JPG, PNG, GIF, MP4, MOV • Max 50MB per file
                                    </p>
                                </div>
                                <input type="file" id="galleryFileInput" accept="image/*,video/*" multiple
                                    class="d-none" />
                                <!-- Preview Grid -->
                                <div class="upload-preview-grid" id="uploadPreviewGrid"></div>
                            </div>
                            <!-- Title -->
                            <div class="mb-3">
                                <label for="uploadTitle" class="form-label fw-600">Title / Description <span
                                        class="text-danger">*</span></label>
                                <input type="text" id="uploadTitle" class="form-control"
                                    placeholder="e.g. Campus tour at TU Munich" required />
                                <div class="invalid-feedback">Please add a title.</div>
                            </div>
                            <!-- Country -->
                            <div class="mb-3">
                                <label for="uploadCountry" class="form-label fw-600">Country</label>
                                <select id="uploadCountry" class="form-select">
                                    <option value="">-- Select Country --</option>
                                    <option value="usa">🇺🇸 USA</option>
                                    <option value="uk">🇬🇧 UK</option>
                                    <option value="canada">🇨🇦 Canada</option>
                                    <option value="germany">🇩🇪 Germany</option>
                                    <option value="turkey">🇹🇷 Turkey</option>
                                    <option value="france">🇫🇷 France</option>
                                </select>
                            </div>
                            <!-- Uploader name -->
                            <div class="mb-4">
                                <label for="uploaderName" class="form-label fw-600">Your Name</label>
                                <input type="text" id="uploaderName" class="form-control"
                                    placeholder="Student / Staff name" />
                            </div>
                            <button type="submit" class="btn-primary-custom w-100 text-center" style="padding:14px;">
                                <i class="bi bi-cloud-upload me-2"></i>Submit for Review
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
